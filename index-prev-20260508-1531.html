    const tryPlay = () => v.play().catch(() => {});
    tryPlay();
    const id = setInterval(() => { if (v.paused && playing) tryPlay(); }, 1500);
    return () => clearInterval(id);
  }, []);

  // Jazz engine — warm rhodes-ish chord pad + walking bass + brush hat,
  // procedural via Web Audio. Matches the cream/rust/gold vibe.
  function startJazz() {
    if (audioRef.current) { audioRef.current.master.gain.cancelScheduledValues(audioRef.current.ctx.currentTime); audioRef.current.master.gain.linearRampToValueAtTime(0.28, audioRef.current.ctx.currentTime + 0.6); return; }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const master = ctx.createGain();
    master.gain.value = 0;
    const verb = ctx.createDelay(0.4); verb.delayTime.value = 0.18;
    const verbGain = ctx.createGain(); verbGain.gain.value = 0.22;
    verb.connect(verbGain).connect(master);
    master.connect(ctx.destination);

    // ii-V-I-VI in F major: Gm9 → C13 → Fmaj9 → Dm11 (warm jazz changes)
    const chords = [
      [55.00, 65.41, 87.31, 103.83, 138.59], // Gm9: G2 C3 F3 Bb3 D4
      [65.41, 82.41, 98.00, 116.54, 146.83], // C13: C3 E3 G3 Bb3 D4
      [43.65, 65.41, 87.31, 98.00, 130.81],  // Fmaj9: F2 C3 F3 G3 C4 (warm)
      [73.42, 87.31, 110.00, 130.81, 164.81] // Dm11: D2 F3 A3 C4 E4
    ];
    const bassWalk = [
      [49.00, 55.00, 61.74, 65.41], // G walk down to C
      [65.41, 73.42, 82.41, 87.31], // C walk up to F
      [43.65, 49.00, 55.00, 58.27], // F walk
      [73.42, 65.41, 61.74, 55.00]  // D walk down to G
    ];
    const beatLen = 0.55; // ~109 bpm
    const barLen = beatLen * 4;
    const loopLen = barLen * chords.length;

    function chord(t, freqs) {
      freqs.forEach((f, i) => {
        const o = ctx.createOscillator();
        o.type = i === 0 ? 'triangle' : 'sine';
        o.frequency.value = f;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.08 - i * 0.005, t + 0.08);
        g.gain.exponentialRampToValueAtTime(0.001, t + barLen * 0.95);
        o.connect(g).connect(master);
        o.connect(g).connect(verb);
        o.start(t);
        o.stop(t + barLen);
      });
    }
    function bass(t, f) {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = f;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + beatLen * 0.9);
      o.connect(g).connect(master);
      o.start(t);
      o.stop(t + beatLen);
    }
    function brush(t) {
      const dur = 0.18;
      const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        const k = i / data.length;
        data[i] = (Math.random() * 2 - 1) * (1 - k) * 0.6;
      }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 4500;
      const g = ctx.createGain(); g.gain.value = 0.04;
      src.connect(hp).connect(g).connect(master);
      src.start(t);
    }

    let nextTime = ctx.currentTime + 0.1;
    function scheduleLoop() {
      const now = ctx.currentTime;
      while (nextTime < now + 0.6) {
        chords.forEach((c, ci) => {
          const ct = nextTime + ci * barLen;
          chord(ct, c);
          bassWalk[ci].forEach((bf, bi) => bass(ct + bi * beatLen, bf));
          for (let b = 0; b < 4; b++) brush(ct + b * beatLen + beatLen * 0.5);
        });
        nextTime += loopLen;
      }
    }
    scheduleLoop();
    const interval = setInterval(scheduleLoop, 1000);

    master.gain.linearRampToValueAtTime(0.28, ctx.currentTime + 0.8);
    audioRef.current = { ctx, master, interval };
  }
  function stopJazz() {
    if (!audioRef.current) return;
    const { ctx, master } = audioRef.current;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
  }

  function frameTC(t) {
    const totalFrames = Math.floor(t * 24);
    const f = totalFrames % 24;
    const totalSec = Math.floor(totalFrames / 24);
    const s = totalSec % 60;
    const m = Math.floor(totalSec / 60);
    return `00:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(f).padStart(2,'0')}`;
  }

  function togglePlay(e) {
    if (e && e.stopPropagation) e.stopPropagation();
    const v = videoRef.current;
    if (!v) return;
    if (playing) { v.pause(); setPlaying(false); }
    else { v.play().then(() => setPlaying(true)).catch(() => {}); }
  }

  function onTimeUpdate() {
    const v = videoRef.current;
    if (v) setTc(frameTC(v.currentTime));
  }

  function toggleSound(e) {
    if (e && e.stopPropagation) e.stopPropagation();
    const next = !muted;
    setMuted(next);
    if (next) stopJazz();
    else startJazz();
  }

  function onClickFrame() {
    if (!playing) togglePlay({ stopPropagation: () => {} });
    else onAdvance();
  }

  return (
    <div className={"hero-portrait-zone" + (shown ? ' shown' : '') + (playing ? ' playing' : '')}
         onClick={onClickFrame}>
      <div className="doodle-layer">
        <DoodleSVG doodleIdx={doodleIdx} animate={shown && !playing}/>
      </div>
      <video
        ref={videoRef}
        src="uploads/hero-justin.mp4"
        playsInline
        autoPlay
        loop
        muted={muted}
        preload="auto"
        onTimeUpdate={onTimeUpdate}
        onCanPlay={() => { setVideoReady(true); setHasVideo(true); }}
        onLoadedData={() => { setVideoReady(true); setHasVideo(true); }}
        onError={() => {
          errorRetries.current += 1;

            setTimeout(() => { try { videoRef.current && videoRef.current.load(); } catch(e){} }, 600 * errorRetries.current);
          } else {
            setHasVideo(false);
          }
        }}
        style={{opacity: hasVideo ? 1 : 0}}/>
      <div className="monitor-chrome" aria-hidden="true"></div>
      <div className="tc-top">
        <span className="rec"><span className="dot"></span>{hasVideo ? 'LIVE · A-CAM' : 'CUE · ' + d.label}</span>
        <span>{hasVideo ? tc : d.tc}</span>
      </div>
      <div className="tc-bot">
        <span>SRC · justin · 1:1 · 24fps</span>
        <span>{hasVideo ? (muted ? 'loop · silent' : 'loop · ♪ jazz') : d.take}</span>
      </div>
      {hasVideo && <>
        {scopes && <div className="hpz-scope" aria-hidden="true">
          <svg viewBox="0 0 100 30" preserveAspectRatio="none">
            <path d="M 0 22 L 6 18 L 12 24 L 18 14 L 24 20 L 30 12 L 36 18 L 42 8 L 48 16 L 54 6 L 60 14 L 66 10 L 72 18 L 78 14 L 84 22 L 90 16 L 96 24 L 100 20"
                  stroke="rgba(184,146,58,0.85)" strokeWidth="0.5" fill="none"/>
            <path d="M 0 24 L 6 22 L 12 26 L 18 20 L 24 23 L 30 18 L 36 22 L 42 14 L 48 19 L 54 12 L 60 18 L 66 16 L 72 21 L 78 18 L 84 25 L 90 20 L 96 26 L 100 23"
                  stroke="rgba(196,84,31,0.7)" strokeWidth="0.5" fill="none"/>
          </svg>
          <div className="scope-meta">WFM · 100 IRE · A1+A2</div>
        </div>}
        {safeArea && <div className="hpz-safe" aria-hidden="true">
          <div className="safe-action"></div>

function TimelineRuler() {
  const playheadRef = useRef(null);
  const [tc, setTc] = useState('00:00:00:00');
  useEffect(() => {
    function frameToTC(pct) {
      const totalFrames = Math.floor(pct * 24 * 90);
      const f = totalFrames % 24;
      const totalSec = Math.floor(totalFrames / 24);
      const s = totalSec % 60;
      const m = Math.floor(totalSec / 60);
      return `00:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(f).padStart(2,'0')}`;
    }
    function onScroll() {
      const max = (document.documentElement.scrollHeight - window.innerHeight);
      const pct = Math.max(0, Math.min(1, window.scrollY / max));
      if (playheadRef.current) playheadRef.current.style.left = `${pct * 100}%`;
      setTc(frameToTC(pct));
    }
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const ticks = [];
  for (let i = 0; i <= 90; i++) {
    const x = (i / 90) * 100;
    const big = i % 5 === 0;
    ticks.push(<line key={i} x1={`${x}%`} x2={`${x}%`} y1={big ? 0 : 14} y2={28}
                     stroke="var(--ink-faded)" strokeWidth={big ? 1 : 0.5}
                     opacity={big ? 0.7 : 0.35}/>);
  }
  const markers = [
    { pct: 22, label: 'I · Media' },
    { pct: 42, label: 'II · Home' },
    { pct: 60, label: 'III · Post' },
    { pct: 82, label: '★ Cutting Room' },
  ];
  return (
    <div className="timeline-ruler" aria-hidden="true">
      <div className="tc-row">
        <span>SEQ · tone.dad · v3 · 24fps</span>
        <span className="timecode">{tc}</span>
        <span>scroll = scrub</span>
      </div>
      <div className="ticks">
        <svg viewBox="0 0 1000 28" preserveAspectRatio="none">{ticks}</svg>
        {markers.map((m, i) => (
          <div key={i} className="marker" style={{left: `${m.pct}%`}}>
            <span className="label">{m.label}</span>
          </div>
        ))}
        <div ref={playheadRef} className="playhead" style={{left: '0%'}}></div>
      </div>
    </div>
  );
}

function TypingHeadline() {
  const line1 = "I'm Justin. I build a lot.";
  const line2 = "One thread: ";
  const [t1, setT1] = useState(0);
  const [t2, setT2] = useState(0);
  const [showTone, setShowTone] = useState(false);

  useEffect(() => {
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) {
      setT1(line1.length); setT2(line2.length); setShowTone(true);
      return;
    }
    const timers = [];
    const speed = 48; // ms per char
    const start = setTimeout(() => {
      let i = 0;
      const tickA = setInterval(() => {
        i++; setT1(i);
        if (i >= line1.length) {
          clearInterval(tickA);
          const between = setTimeout(() => {
            let j = 0;
            const tickB = setInterval(() => {
              j++; setT2(j);
              if (j >= line2.length) {
                clearInterval(tickB);
                const reveal = setTimeout(() => setShowTone(true), 360);
                timers.push(reveal);
              }
            }, speed);
            timers.push({clear: () => clearInterval(tickB)});
          }, 420);
          timers.push(between);
        }
      }, speed);
      timers.push({clear: () => clearInterval(tickA)});
    }, 320);
    timers.push(start);
    return () => timers.forEach(t => { if (t && t.clear) t.clear(); else clearTimeout(t); });
  }, []);

  const line1Done = t1 >= line1.length;
  const line2Done = t2 >= line2.length;

  return (
    <h1>
      <span>{line1.slice(0, t1)}</span>
      {!line1Done && <span className="caret"></span>}
      {line1Done && <br/>}
      {line1Done && <span>{line2.slice(0, t2)}</span>}
      {line1Done && !line2Done && <span className="caret"></span>}
      {showTone && (
        <span className="tone-mark tone-reveal"><span className="tm-pad"></span><span className="tm-text">tone.</span></span>
      )}
      {line2Done && !showTone && <span className="caret"></span>}
    </h1>
  );
}

// ── Style A · slot-reveal source monitor
function QAReel() {
  const [i, setI] = useStateNP(0);
  const [phase, setPhase] = useStateNP('pain'); // 'pain' | 'fix'
  const total = QA_PAIRS.length;
  const q = QA_PAIRS[i];

  function next() {
    if (phase === 'pain') { setPhase('fix'); return; }
    setPhase('pain');
    setI((x) => (x + 1) % total);
  }
  function prev() {
    if (phase === 'fix') { setPhase('pain'); return; }
    setPhase('fix');
    setI((x) => (x - 1 + total) % total);
  }

  return (
    <div className={"qa-reel phase-"+phase}>
      <div className="qa-reel-monitor">
        <div className="qa-mon-chrome">
          <span className="qa-tc">TC&nbsp;{q.tc}</span>
          <span className={"qa-clip-chip clip-color-"+q.color}>{q.label}</span>
          <span className="qa-counter">{String(i+1).padStart(2,'0')} / {String(total).padStart(2,'0')}</span>
        </div>

        <div className="qa-mon-stage">
          {/* PAIN side */}
          <div className="qa-side qa-pain" aria-hidden={phase!=='pain'}>
            <div className="qa-side-eyebrow">— You, right now</div>
            <p className="qa-side-line">{q.pain}</p>
            <p className="qa-side-hint">{q.hint}</p>
          </div>
          {/* FIX side */}
          <div className="qa-side qa-fix" aria-hidden={phase!=='fix'}>
            <div className="qa-side-eyebrow">— Us, with a coffee</div>
            <p className="qa-side-line">{q.fix}</p>
            <p className="qa-side-hint">{q.note}</p>
          </div>
        </div>

        <div className="qa-mon-foot">
          <button className="qa-btn qa-prev" onClick={prev} aria-label="Previous">
            <span className="kbd">J</span>
          </button>
          <button className="qa-btn qa-play" onClick={next} aria-label={phase==='pain'?'Show the fix':'Next pain point'}>
            {phase === 'pain'
              ? <><span>show me the fix</span><span className="arrow">→</span></>
              : <><span>next</span><span className="arrow">→</span></>}
          </button>
          <button className="qa-btn qa-next" onClick={next} aria-label="Next">
            <span className="kbd">L</span>
          </button>
        </div>
      </div>

      <div className="qa-reel-rail">
        {QA_PAIRS.map((p, idx) => (
          <button key={idx}
                  className={"qa-rail-tick"+(idx===i?' on':'')+(idx<i?' done':'')}
                  onClick={()=>{ setI(idx); setPhase('pain'); }}
                  aria-label={`Jump to ${p.label}`}>
            <span className={"qa-rail-chip clip-color-"+p.color}></span>
            <span className="qa-rail-label">{p.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

// ── Style B · horizontal clip-strip timeline
function QAStrip() {
  const [open, setOpen] = useStateNP(0);
  const total = QA_PAIRS.length;

  return (
    <div className="qa-strip-wrap">
      <div className="qa-strip-ruler" aria-hidden="true">
        {Array.from({length: 13}).map((_, n) => (

          </span>
        ))}

      <div className="qa-strip-row" role="list">
        {QA_PAIRS.map((p, idx) => {
          const on = idx === open;
          return (
            <div key={idx} role="listitem"
                 className={"qa-clip"+(on?' on':'')+" clip-color-"+p.color}

function fitVerdict(ans) {
  // Light scoring — anyone who's serious gets a warm verdict.
  const a = ans.avg, v = ans.vol;
  if ((a==='c' || a==='d') && (v==='c' || v==='d' || v==='b')) {
    return { tier: 'studio', label: 'Studio fit', tag: 'Strong fit · Pack 01 + a conversation' };
  }
  if (a==='b' || a==='c') {
    return { tier: 'core',   label: 'Core fit',   tag: 'Solid fit · Pack 01 starts here' };
  }
  return       { tier: 'pack', label: 'Pack 00 fit', tag: 'You\'re early. Pack 00 is exactly for you.' };
}

function QuizModal({ onClose }) {
  const [step, setStep] = useStateNP(0); // 0..3 = qs, 4 = email, 5 = thanks
  const [ans, setAns] = useStateNP({});
  const [email, setEmail] = useStateNP('');
  const [submitting, setSubmitting] = useStateNP(false);
  const total = QUIZ_QS.length;

  React.useEffect(() => {
    function onKey(e) { if (e.key === 'Escape') onClose(); }
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => {
      window.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
    };
  }, []);

  function pick(k, v) {
    const next = { ...ans, [k]: v };
    setAns(next);
    setTimeout(() => {
      if (step < total - 1) setStep(step + 1);
      else setStep(total); // → email
    }, 220);
  }

  function submit(e) {
    e.preventDefault();
    if (!email || !email.includes('@')) return;
    setSubmitting(true);
    setTimeout(() => { setStep(total + 1); setSubmitting(false); }, 700);
  }

  const verdict = step >= total ? fitVerdict(ans) : null;

  return (
    <div className="qm-backdrop" onClick={(e) => { if (e.target.classList.contains('qm-backdrop')) onClose(); }}>
      <div className="qm" role="dialog" aria-modal="true" aria-labelledby="qm-title">
        {/* chrome */}
        <div className="qm-chrome">
          <div className="qm-chrome-l">
            <span className="qm-chrome-mark">▮</span>
            <span className="qm-chrome-cap">Studio fit · 2 min</span>
          </div>
          <div className="qm-chrome-c">
            <span className="qm-chrome-tc">REEL 04 · INTAKE</span>
          </div>
          <button className="qm-close" onClick={onClose} aria-label="Close">esc</button>
        </div>

        {/* progress timeline */}
        <div className="qm-progress">
          {Array.from({length: total + 1}).map((_, i) => (
            <span key={i} className={"qm-prog-tick"+(i <= step ? ' on' : '')+(i === step ? ' cur' : '')}></span>
          ))}
          <span className="qm-prog-meta">
            {step < total ? `Q ${step+1} / ${total}` : (step === total ? 'Send the kit' : 'Sent.')}
          </span>
        </div>

        {/* body */}
        <div className="qm-body">
          {step < total && (
            <div className="qm-q" key={step}>
              <div className="qm-q-eyebrow">Q · {String(step+1).padStart(2,'0')}</div>
              <h4 id="qm-title" className="qm-q-title">{QUIZ_QS[step].q}</h4>
              <div className="qm-opts">
                {QUIZ_QS[step].opts.map(o => (
                  <button key={o.v}
                          className={"qm-opt"+(ans[QUIZ_QS[step].k]===o.v ? ' on' : '')}
                          onClick={() => pick(QUIZ_QS[step].k, o.v)}>
                    <span className="qm-opt-tick"></span>
                    <span className="qm-opt-text">{o.t}</span>
                  </button>
                ))}
              </div>
            </div>
          )}

          {step === total && (
            <div className="qm-email" key="email">
              <div className="qm-q-eyebrow">Verdict · {verdict.label}</div>
              <h4 id="qm-title" className="qm-q-title">
                {verdict.tier === 'studio' ? <>You're our kind of studio. <em>Let's talk.</em></>
                  : verdict.tier === 'core' ? <>Pack 01 was built for this exact stage. <em>Drop your email.</em></>
                  : <>Pack 00 is exactly for you. <em>Free, on us.</em></>}
              </h4>
              <p className="qm-email-tag">{verdict.tag}</p>
              <p className="qm-email-lede">
                Drop your email and we'll send <strong>Pack 00</strong> — our exact post folder structure + naming convention, the one we use every Monday. Plus a fit-check note from Justin within 48 hrs.
              </p>
              <form className="qm-form" onSubmit={submit}>
                <input type="email"
                       className="qm-input"
                       placeholder="you@studio.co"
                       value={email}
                       onChange={(e) => setEmail(e.target.value)}
                       autoFocus
                       required/>
                <button type="submit" className="qm-submit" disabled={submitting}>
                  {submitting ? 'sending…' : <>Send me Pack 00 <span className="arrow">→</span></>}
                </button>
              </form>
              <div className="qm-fineprint">no spam · unsubscribe one click · we read every reply</div>
            </div>
          )}

          {step === total + 1 && (
            <div className="qm-thanks" key="thanks">
              <div className="qm-q-eyebrow">Sent · check your inbox</div>
              <h4 className="qm-q-title">Pack 00 is on its way. <em>Welcome.</em></h4>
              <p className="qm-email-lede">
                You'll get the folder kit in the next few minutes — and a personal reply from Justin inside 48 hrs. If we're a fit, we'll book a 20-minute call and walk through it together.
              </p>
              <button className="qm-submit qm-thanks-close" onClick={onClose}>
                Close <span className="arrow">→</span>
              </button>
            </div>
          )}
        </div>

        {/* foot */}
        <div className="qm-foot">
          <span>Noble · Posthouse · NJ</span>
          <span className="qm-foot-tc">{new Date().toISOString().slice(0,10).replace(/-/g,'.')}</span>
        </div>
      </div>
    </div>
  );
}

// ============ edit-suite.jsx ============
// edit-suite.jsx — Tier 3.2 · corner monogram that expands on hover/click.
// Tracks current section via IntersectionObserver. NOT a chatbot. Status board only.
// Quiet by default — single 44px orb. Pulses gold dot if scarcity is active.

const { useEffect: esUseEffect, useState: esUseState, useRef: esUseRef } = React;

function EditSuite() {
  const sections = [
    { id: 'hero',       label: 'Hero',       status: 'cutting · idle' },
    { id: 'tonemedia',  label: 'Tonemedia',  status: 'viewing · 350+ weddings' },
    { id: 'noblepost',  label: 'Noblepost',  status: '★ Pack 01 · live now', scarcity: true },
    { id: 'tonehomes',  label: 'Tonehomes',  status: 'viewing · anyone curious, esp. NJ' },
    { id: 'cutting-room', label: 'Cutting Room', status: '★ writing · cut 002 in draft' },
  ];
  const [active, setActive] = esUseState('hero');
  const [open, setOpen] = esUseState(false);
  const ref = esUseRef(null);

  esUseEffect(() => {
    // figure out current section by scroll pos vs section tops (more reliable than IO here)
    function onScroll() {
      const y = window.scrollY + window.innerHeight * 0.4;
      let cur = 'hero';
      sections.forEach(s => {
        const el = document.getElementById(s.id) || (s.id === 'hero' ? document.querySelector('.hero') : null);
        if (el && el.offsetTop <= y) cur = s.id;
      });
      setActive(cur);
    }
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  // close on outside click
  esUseEffect(() => {
    if (!open) return;
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [open]);

  const cur = sections.find(s => s.id === active) || sections[0];

  return (
    <div className={"edit-suite" + (open ? ' open' : '')} ref={ref}>
      <div className="monogram"
           onClick={() => setOpen(true)}
           onMouseEnter={() => setOpen(true)}
           title="edit suite">
        td
      </div>
      <div className="panel" onMouseLeave={() => setOpen(false)}>
        <div className="head">
          <span>EDIT SUITE</span>
          <span className="close" onClick={() => setOpen(false)}>×</span>
        </div>
        {sections.map((s, i) => (
          <div key={s.id} className={"row" + (s.id === active ? ' active' : '')}>
            <span>{s.label}</span>
            <span style={{opacity:0.4, fontVariantNumeric:'tabular-nums'}}>0{i+1}</span>
          </div>
        ))}
        <div className="status">
          <span className="pulse-dot"></span>{cur.status}
          {cur.scarcity && <div className="scarcity">5 mood templates. drop, render, deliver.</div>}
        </div>
      </div>
    </div>
  );
}
window.EditSuite = EditSuite;
